spring.application.name=Train-Office
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=train_dbgit;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
server.port=8081

# OCR (Tesseract) for CCCD scanning
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
ocr.tessdata-path=tessdata
ocr.language=vie+eng
# Crop region (fractions of the framed card) for the digits/DOB pass.
# Tune these if the DOB is cut off or still noisy.
ocr.dob-crop.x=0.30
ocr.dob-crop.y=0.28
ocr.dob-crop.w=0.70
ocr.dob-crop.h=0.45

