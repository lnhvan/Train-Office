<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{seat.seatLayout}, ~{::section}, 'seats')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-grid-3x3-gap"></i> [[#{seat.seatMap}]]</span>
            <h1>[[#{seat.seatLayout}]]</h1>
            <p>[[#{seat.visualOverviewOfSeatsInThe}]]</p>
        </div>
        <a class="btn rj-btn-quiet" th:href="@{/admin/seats}">
            <i class="bi bi-arrow-left"></i> [[#{seat.backToSeats}]]
        </a>
    </div>

    <div class="card admin-table-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{seat.seatMap}]]</span>
            <small th:text="#{common.nSeats(${#lists.size(seats)})}">0 seats</small>
        </div>
        <div class="card-body">
            <div class="seat-map-grid admin-seat-map">
                <button type="button" class="seat available" th:each="seat : ${seats}" th:text="${seat.seatNumber}">A1</button>
            </div>
            <div class="admin-empty-state" th:if="${#lists.isEmpty(seats)}">
                <i class="bi bi-grid-3x2-gap"></i>
                <strong>[[#{seat.noSeatsToDisplay}]]</strong>
                <span>[[#{seat.addSeatsBeforeUsingTheLayout}]]</span>
            </div>
        </div>
    </div>
</section>
</html>
