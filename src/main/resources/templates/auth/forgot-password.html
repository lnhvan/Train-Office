<!DOCTYPE html>
<html th:lang="${#locale.language}" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[#{auth.forgotPasswordRailjet}]]</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/rj-base.css}">
    <link rel="stylesheet" th:href="@{/css/rj-auth.css}">
</head>
<body class="rj-auth">
<div class="lang-switcher--floating"><div th:replace="~{fragments/language-switcher :: languageSwitcher('dark')}"></div></div>
<main class="rj-auth-layout">
    <aside class="rj-auth-aside" aria-hidden="true">
        <a class="rj-auth-brand" th:href="@{/booking/search}"><i class="bi bi-train-front-fill"></i>RailJet</a>
        <div class="rj-auth-aside-copy">
            <p class="rj-auth-aside-title">[[#{booking.crossDistance}]]<br>[[#{booking.masterTime}]]</p>
            <p>[[#{auth.technologicalElegance}]]</p>
        </div>
        <div class="rj-auth-track"><span></span><span></span></div>
    </aside>

    <section class="rj-auth-panel">
        <a class="rj-back-link" th:href="@{/login}">
            <i class="bi bi-arrow-left"></i>
            [[#{auth.backToSignIn}]]
        </a>
        <div class="rj-auth-card">
            <span class="rj-auth-icon"><i class="bi bi-envelope-open"></i></span>
            <h1>[[#{auth.forgotPassword}]]</h1>
            <p class="rj-auth-sub">[[#{auth.forgotPasswordSub}]]</p>

            <div class="alert alert-success"
                 th:if="${successMessage}"
                 th:text="${successMessage}">
                Request completed successfully.
            </div>
            <div class="alert alert-info"
                 th:if="${infoMessage}"
                 th:text="${infoMessage}">
                Info.
            </div>
            <div class="alert alert-danger"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
                Email does not exist.
            </div>

            <form id="forgotPasswordForm"
                  th:action="@{/forgot-password}"
                  th:object="${forgotPasswordForm}"
                  method="post"
                  novalidate>
                <div class="rj-field">
                    <label class="form-label" for="email">[[#{common.emailAddress}]]</label>
                    <div class="rj-input-icon">
                        <i class="bi bi-envelope"></i>
                        <input id="email"
                               type="email"
                               class="form-control"
                               th:field="*{email}"
                               placeholder="traveler@railjet.com"
                               autocomplete="email"
                               required>
                    </div>
                    <div class="rj-field-error"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>
                </div>
                <button class="btn btn-primary btn-lg rj-btn-block" type="submit">
                    <i class="bi bi-send"></i>
                    [[#{auth.sendResetCode}]]
                </button>
            </form>
        </div>
    </section>
</main>

</body>
</html>
