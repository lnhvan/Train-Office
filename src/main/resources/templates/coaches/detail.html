<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{coach.coachDetail}, ~{::section}, 'coaches')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-train-lightrail-front"></i> [[#{coach.coachDetail}]]</span>
            <h1 th:text="${detail.coachNumber}">Coach</h1>
            <p th:text="${detail.train != null ? detail.train.trainCode : #messages.msg('coach.noTrain')}">Train</p>
        </div>
        <div class="admin-page-actions">
            <a class="btn rj-btn-quiet" th:href="@{/admin/coaches}">
                <i class="bi bi-arrow-left"></i> [[#{common.back}]]
            </a>
            <a class="btn btn-outline-info" th:href="@{/admin/seats(coachId=${detail.coachId})}">
                <i class="bi bi-grid-3x2-gap"></i> [[#{common.seats}]]
            </a>
            <a class="btn btn-warning" th:href="@{/admin/coaches/edit/{id}(id=${detail.coachId})}">
                <i class="bi bi-pencil-square"></i> [[#{common.edit}]]
            </a>
        </div>
    </div>

    <div class="card admin-detail-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{coach.coachInformation}]]</span>
            <small>[[#{coach.coachTypeAndPassengerCapacity}]]</small>
        </div>
        <div class="card-body">
            <dl class="admin-detail-grid">
                <dt>ID</dt><dd th:text="${detail.coachId}">1</dd>
                <dt>[[#{common.train}]]</dt><dd th:text="${detail.train != null ? detail.train.trainCode : '-'}">SE1</dd>
                <dt>[[#{coach.coachNumber}]]</dt><dd th:text="${detail.coachNumber}">C01</dd>
                <dt>[[#{common.type}]]</dt><dd th:text="${detail.coachType}">SOFT_SEAT</dd>
                <dt>[[#{coach.capacity}]]</dt><dd><span class="capacity-pill" th:text="#{common.nSeats(${detail.capacity})}">64 seats</span></dd>
            </dl>
        </div>
    </div>
</section>
</html>
