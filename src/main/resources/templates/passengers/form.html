<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{passenger.passengerForm}, ~{::section}, 'passengers')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-person-vcard"></i> [[#{passenger.passengerProfile}]]</span>
            <h1 th:text="${passenger.passengerId == null ? #messages.msg('passenger.createPassenger') : #messages.msg('passenger.editPassenger')}">Passenger form</h1>
            <p>[[#{passenger.maintainBasicPassengerIdentityInformationUsed}]]</p>
        </div>
        <a class="btn rj-btn-quiet" th:href="@{/admin/passengers}">
            <i class="bi bi-arrow-left"></i> [[#{passenger.backToPassengers}]]
        </a>
    </div>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card admin-form-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{common.passengerInformation}]]</span>
            <small>[[#{passenger.allFieldsStayEditableForThe}]]</small>
        </div>
        <form th:action="@{/admin/passengers/save}" th:object="${passenger}" method="post">
            <input type="hidden" th:field="*{passengerId}">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.fullName}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input class="form-control" th:field="*{fullName}" maxlength="100" required>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.identityNumber}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
                            <input class="form-control" th:field="*{identityNumber}" maxlength="30">
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.dateOfBirth}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                            <input class="form-control" th:field="*{dateOfBirth}" type="date">
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.gender}]]</label>
                        <select class="form-select" th:field="*{gender}">
                            <option value="">[[#{common.selectGender}]]</option>
                            <option th:each="gender : ${genders}" th:value="${gender}" th:text="${#messages.msgOrNull('enum.' + (gender)) ?: (gender)}"></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-end">
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-check2-circle"></i> [[#{common.save}]]
                </button>
            </div>
        </form>
    </div>
</section>
</html>
