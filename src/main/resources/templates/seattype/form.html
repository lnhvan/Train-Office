<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(#{seatType.seatTypeForm}, ~{::section}, 'seat-types')}">
<section>
    <div class="admin-page-hero">
        <a th:href="@{/seat-types}"
           class="btn rj-btn-quiet">
            <i class="bi bi-arrow-left"></i>
            [[#{common.back}]]
        </a>
        <div>
            <span class="admin-page-kicker"><i class="bi bi-tags"></i> [[#{seatType.seatTypeManagement}]]</span>
            <h1 th:text="${seatType.id == null ? #messages.msg('seatType.addSeatType') : #messages.msg('seatType.editSeatType')}"></h1>
            <p>[[#{seatType.enterSeatTypeInformation}]]</p>
        </div>
    </div>

    <div class="card admin-form-card rj-form-narrow-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{seatType.seatTypeInformation}]]</span>
        </div>

        <form th:action="@{/seat-types/save}"
              th:object="${seatType}"
              method="post">
            <input type="hidden" th:field="*{id}">

            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="name">[[#{seatType.seatTypeName}]]</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{name}"
                               th:placeholder="#{seatType.exampleVip}">
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="pricePerKm">[[#{seatType.pricePerKm}]]</label>
                        <div class="input-group">
                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   class="form-control"
                                   th:field="*{pricePerKm}"
                                   placeholder="1000">
                            <span class="input-group-text">VND / km</span>
                        </div>
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('pricePerKm')}"
                             th:errors="*{pricePerKm}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-footer">
                <a th:href="@{/seat-types}"
                   class="btn btn-outline-secondary">
                    [[#{common.cancel}]]
                </a>
                <button class="btn btn-primary"
                        type="submit">
                    <i class="bi bi-check2-circle"></i>
                    [[#{common.save}]]
                </button>
            </div>
        </form>
    </div>
</section>
</html>
