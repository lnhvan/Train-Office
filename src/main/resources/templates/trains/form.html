<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{train.trainForm}, ~{::section}, 'trains')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-train-front"></i> [[#{train.trainProfile}]]</span>
            <h1 th:text="${train.trainId == null ? #messages.msg('train.addTrain') : #messages.msg('train.updateTrain')}">Train Form</h1>
            <p>[[#{train.maintainTrainIdentityAndOperatingStatus}]]</p>
        </div>
        <a th:href="@{/admin/trains}" class="btn rj-btn-quiet">
            <i class="bi bi-arrow-left"></i> [[#{train.backToTrains}]]
        </a>
    </div>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card admin-form-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{train.trainInformation}]]</span>
            <small>[[#{train.trainCodeMustRemainUniqueAcross}]]</small>
        </div>
        <form th:action="@{/admin/trains/save}" th:object="${train}" method="POST">
            <input type="hidden" th:field="*{trainId}">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="trainCode">[[#{train.trainCode}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-hash"></i></span>
                            <input class="form-control" type="text" th:field="*{trainCode}" id="trainCode" required>
                        </div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('trainCode')}" th:errors="*{trainCode}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="trainName">[[#{train.trainName}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-train-front"></i></span>
                            <input class="form-control" type="text" th:field="*{trainName}" id="trainName" required>
                        </div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('trainName')}" th:errors="*{trainName}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="selectedTrainType">[[#{train.trainType}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-tags"></i></span>
                            <select class="form-select" id="selectedTrainType" name="selectedTrainType" required
                                    th:attr="data-other-value=${otherTrainTypeValue}">
                                <option value="">[[#{train.selectTrainType}]]</option>
                                <option th:each="type : ${availableTrainTypes}"
                                        th:value="${type}"
                                        th:text="${type}"
                                        th:selected="${selectedTrainType == type}">Express</option>
                                <option th:value="${otherTrainTypeValue}"
                                        th:selected="${selectedTrainType == otherTrainTypeValue}">[[#{common.other}]]</option>
                            </select>
                        </div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('trainType')}" th:errors="*{trainType}"></div>
                    </div>
                    <div class="col-md-4 mb-3" id="newTrainTypeGroup"
                         th:style="${selectedTrainType == otherTrainTypeValue ? '' : 'display:none;'}">
                        <label class="form-label" for="newTrainType">[[#{train.newTrainType}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-plus-lg"></i></span>
                            <input class="form-control" type="text" id="newTrainType" name="newTrainType"
                                   th:value="${newTrainType}">
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="status">[[#{common.status}]]</label>
                        <select class="form-select" th:field="*{status}" id="status">
                            <option th:each="s : ${allTrainStatus}" th:value="${s}" th:text="${#messages.msgOrNull('enum.' + s) ?: s.description}"></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-end gap-2">
                <a th:href="@{/admin/trains}" class="btn btn-outline-secondary">[[#{common.cancel}]]</a>
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-check2-circle"></i> [[#{train.saveTrain}]]
                </button>
            </div>
        </form>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const typeSelect = document.getElementById('selectedTrainType');
            const newTypeGroup = document.getElementById('newTrainTypeGroup');
            const newTypeInput = document.getElementById('newTrainType');
            const otherValue = typeSelect ? typeSelect.dataset.otherValue : '';

            if (!typeSelect || !newTypeGroup || !newTypeInput) {
                return;
            }

            function updateNewTypeVisibility() {
                const isOther = typeSelect.value === otherValue;
                newTypeGroup.style.display = isOther ? '' : 'none';
                newTypeInput.required = isOther;
            }

            typeSelect.addEventListener('change', updateNewTypeVisibility);
            updateNewTypeVisibility();
        });
    </script>
</section>
</html>
