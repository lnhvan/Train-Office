<span xmlns:th="http://www.thymeleaf.org"
      th:fragment="statusBadge(status)"
      th:with="s=${status == null ? 'UNKNOWN' : #strings.toUpperCase(status.toString())}"
      class="rj-badge"
      th:classappend="${s == 'SUCCESS' or s == 'PAID' or s == 'ACTIVE' or s == 'CONFIRMED' or s == 'APPROVED'} ? ' is-success' : (${s == 'PENDING' or s == 'SCHEDULED' or s == 'PROCESSING'} ? ' is-warning' : (${s == 'FAILED' or s == 'CANCELLED' or s == 'REJECTED' or s == 'INACTIVE'} ? ' is-danger' : ' is-neutral'))"
      th:text="${#messages.msgOrNull('enum.' + (s)) ?: (s)}">STATUS</span>
