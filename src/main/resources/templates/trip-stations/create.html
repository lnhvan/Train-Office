<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{tripStation.addTripStation}, ~{::section}, 'trips')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-plus-circle"></i> [[#{tripStation.addStop}]]</span>
            <h1>[[#{tripStation.addTripStation}]]</h1>
            <p th:text="${trip.train != null ? trip.train.trainName : #messages.msg('common.trip')}">Trip</p>
        </div>
        <a class="btn rj-btn-quiet" th:href="@{/admin/trips/{tripId}/stations(tripId=${trip.tripId})}">
            <i class="bi bi-arrow-left"></i> [[#{tripStation.backToTimeline}]]
        </a>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card admin-form-card trip-form-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{tripStation.stopDetails}]]</span>
            <small>[[#{tripStation.chooseAStationOfTheRoute}]]</small>
        </div>
        <form th:action="@{/admin/trips/{tripId}/stations/save(tripId=${trip.tripId})}" th:object="${tripStation}" method="post">
            <div class="card-body">
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label" for="routeStationId">[[#{tripStation.routeStation}]]</label>
                        <select class="form-select" id="routeStationId" name="routeStation.routeStationId" required>
                            <option value="">[[#{common.selectStation}]]</option>
                            <option th:each="rs : ${routeStations}"
                                    th:value="${rs.routeStationId}"
                                    th:selected="${tripStation.routeStation != null and tripStation.routeStation.routeStationId == rs.routeStationId}"
                                    th:text="${rs.stationOrder + '. ' + rs.station.stationName + ' (' + rs.station.stationCode + ') · ' + #numbers.formatDecimal(rs.distanceFromStartKm != null ? rs.distanceFromStartKm : 0, 1, 0) + ' km'}">1. Ha Noi (HAN) · 0 km</option>
                        </select>
                        <div class="form-text">[[#{tripStation.orderFollowsRoute}]]</div>
                        <div class="text-danger small mt-1" th:if="${#lists.isEmpty(routeStations)}">[[#{tripStation.routeHasNoStations}]]</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.arrivalTime}]]</label>
                        <input class="form-control" type="datetime-local" th:field="*{arrivalTime}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.departureTime}]]</label>
                        <input class="form-control" type="datetime-local" th:field="*{departureTime}">
                    </div>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/admin/trips/{tripId}/stations(tripId=${trip.tripId})}">[[#{common.cancel}]]</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check2-circle"></i> [[#{tripStation.saveStop}]]
                </button>
            </div>
        </form>
    </div>
</section>
</html>
