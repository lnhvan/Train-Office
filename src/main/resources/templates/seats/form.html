<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{seat.seatForm}, ~{::section}, 'seats')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-grid-3x2-gap"></i> [[#{seat.seatProfile}]]</span>
            <h1 th:text="${seat.seatId == null ? #messages.msg('seat.addNewSeat') : #messages.msg('seat.editSeat')}">Seat Form</h1>
            <p>[[#{seat.configureSeatNumberCoachAssignmentType}]]</p>
        </div>
        <a th:href="@{/admin/seats(coachId=${selectedCoachId})}" class="btn rj-btn-quiet">
            <i class="bi bi-arrow-left"></i> [[#{seat.backToSeats}]]
        </a>
    </div>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card admin-form-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{seat.seatInformation}]]</span>
            <small>[[#{seat.seatNumberShouldBeUniqueInside}]]</small>
        </div>
        <form th:action="@{/admin/seats/save}" th:object="${seat}" method="post">
            <input type="hidden" th:field="*{seatId}">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.coach}]]</label>
                        <select class="form-select" th:field="*{coach.coachId}">
                            <option value="">[[#{seat.selectCoach}]]</option>
                            <option th:each="coach : ${allCoaches}"
                                    th:value="${coach.coachId}"
                                    th:text="${coach.train != null ? coach.train.trainCode + ' / ' + coach.coachNumber : coach.coachNumber}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{seat.seatNumber}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-hash"></i></span>
                            <input class="form-control" th:field="*{seatNumber}">
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{seat.seatType}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-tag"></i></span>
                            <input class="form-control" th:field="*{seatType}">
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{seat.extraPrice}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-cash-stack"></i></span>
                            <input type="number" step="0.01" class="form-control" th:field="*{extraPrice}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-end gap-2">
                <a th:href="@{/admin/seats(coachId=${selectedCoachId})}" class="btn btn-outline-secondary">[[#{common.cancel}]]</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check2-circle"></i> [[#{seat.saveSeat}]]
                </button>
            </div>
        </form>
    </div>
</section>
</html>
