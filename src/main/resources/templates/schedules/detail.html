<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(#{schedule.scheduleDetail}, ~{::section}, 'schedules')}">
<section>
<div th:replace="~{fragments/breadcrumb :: breadcrumb(${breadcrumbs})}"></div><div class="card"><div class="card-header d-flex justify-content-between"><span>[[#{schedule.scheduleDetail}]]</span><span th:replace="~{fragments/status-badge :: statusBadge(${detail.status})}"></span></div><div class="card-body table-responsive"><table class="table table-bordered"><tr><th>[[#{common.tripId}]]</th><td th:text="${detail.tripId}">tripId</td></tr>
<tr><th>[[#{common.train}]]</th><td th:text="${detail.train}">train</td></tr>
<tr><th>[[#{common.route}]]</th><td th:text="${detail.route}">route</td></tr>
<tr><th>[[#{common.departureTime}]]</th><td th:text="${detail.departureTime}">departureTime</td></tr>
<tr><th>[[#{common.arrivalTime}]]</th><td th:text="${detail.arrivalTime}">arrivalTime</td></tr>
<tr><th>[[#{common.status}]]</th><td th:text="${#messages.msgOrNull('enum.' + (detail.status)) ?: (detail.status)}">status</td></tr></table></div><div class="card-footer"><a class="btn btn-secondary" th:href="@{'/admin/schedules'}">[[#{common.back}]]</a> <a class="btn btn-warning" th:href="@{'/admin/schedules/' + ${detail.id} + '/edit'}">[[#{common.edit}]]</a></div></div>
</section>
</html>
