<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{route.routeStationForm}, ~{::section}, 'routes')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker">
                <i class="bi bi-map"></i>
                [[#{route.routeStation}]]
            </span>

            <h1>[[#{route.routeStationForm}]]</h1>

            <p>
                <span th:text="${route.routeCode}">HN-SG</span>
                <span>-</span>
                <span th:text="${route.routeName}">Ha Noi - Sai Gon</span>
            </p>
        </div>

        <a class="btn rj-btn-quiet" th:href="@{/admin/routes/{routeId}/stations(routeId=${route.routeId})}">
            <i class="bi bi-arrow-left"></i>
            [[#{route.backToSequence}]]
        </a>
    </div>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card admin-form-card route-station-form-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{route.stationPlacement}]]</span>
            <small>
                [[#{route.selectOneStationSetItsOrder}]]
            </small>
        </div>

        <form th:action="${formAction}" th:object="${routeStation}" method="post">
            <div class="card-body">
                <div class="row">
                    <div class="col-lg-4 mb-3">
                        <label class="form-label" for="station">[[#{common.station}]]</label>

                        <div class="input-group">
                            <span class="input-group-text">
                                    <i class="bi bi-geo-alt"></i>
                                </span>

                            <select id="station" class="form-select" name="station.stationId" required>
                                <option value="">[[#{common.selectStation}]]</option>

                                <option th:each="station : ${stations}"
                                        th:value="${station.stationId}"
                                        th:selected="${routeStation.station != null and routeStation.station.stationId == station.stationId}"
                                        th:text="${station.stationCode + ' - ' + station.stationName + ' (' + station.city + ')'}">
                                    HN - Ha Noi
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="col-lg-4 mb-3">
                        <label class="form-label" for="stationOrder">[[#{common.stationOrder}]]</label>

                        <div class="input-group">
                            <span class="input-group-text">
                                    <i class="bi bi-list-ol"></i>
                                </span>

                            <input id="stationOrder"
                                   class="form-control"
                                   type="number"
                                   min="1"
                                   th:field="*{stationOrder}"
                                   th:placeholder="#{route.autoIfEmpty}">
                        </div>

                        <small class="form-text text-muted">
                            [[#{route.emptyAutomaticallyAddedToTheEnd}]]
                        </small>
                    </div>

                    <div class="col-lg-4 mb-3">
                        <label class="form-label" for="distanceFromStartKm">[[#{route.kmMarker}]]</label>

                        <div class="input-group">
                            <span class="input-group-text">
                                    <i class="bi bi-sign-railroad"></i>
                                </span>

                            <input id="distanceFromStartKm"
                                   class="form-control"
                                   type="number"
                                   min="0"
                                   step="0.1"
                                   th:field="*{distanceFromStartKm}"
                                   th:placeholder="#{route.example1500}">
                        </div>

                        <small class="form-text text-muted">
                            [[#{route.exampleHoChiMinhCity1000}]]
                        </small>
                    </div>
                </div>
            </div>

            <div class="card-footer d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary"
                   th:href="@{/admin/routes/{routeId}/stations(routeId=${route.routeId})}">
                    [[#{common.cancel}]]
                </a>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check2-circle"></i>
                    [[#{route.savePlacement}]]
                </button>
            </div>
        </form>
    </div>
</section>
</html>
