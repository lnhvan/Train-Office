<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{route.routeDetail}, ~{::section}, 'routes')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-signpost-split"></i> [[#{route.routeDetail}]]</span>
            <h1 th:text="${detail.routeName}">Route</h1>
            <p th:text="${detail.routeCode}">HN-SG</p>
        </div>
        <div class="admin-page-actions">
            <a class="btn rj-btn-quiet" th:href="@{/admin/routes}">
                <i class="bi bi-arrow-left"></i> [[#{common.back}]]
            </a>
            <a class="btn btn-outline-info" th:href="@{/admin/routes/{routeId}/stations(routeId=${detail.routeId})}">
                <i class="bi bi-list-ol"></i> [[#{route.manageStations}]]
            </a>
            <a class="btn btn-warning" th:href="@{'/admin/routes/edit/' + ${detail.routeId}}">
                <i class="bi bi-pencil-square"></i> [[#{common.edit}]]
            </a>
        </div>
    </div>

    <div class="card admin-detail-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{route.routeInformation}]]</span>
            <small>[[#{route.routeIdentityAndTravelDistance}]]</small>
        </div>
        <div class="card-body">
            <dl class="admin-detail-grid">
                <dt>ID</dt><dd th:text="${detail.routeId}">1</dd>
                <dt>[[#{common.code}]]</dt><dd th:text="${detail.routeCode}">HN-SG</dd>
                <dt>[[#{common.name}]]</dt><dd th:text="${detail.routeName}">Ha Noi - Sai Gon</dd>
                <dt>[[#{route.distance}]]</dt><dd><span th:text="${detail.distanceKm}">0</span> km</dd>
            </dl>
        </div>
    </div>
</section>
</html>
