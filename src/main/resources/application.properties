spring.application.name=Train-Office

# --- Database ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=train_office;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
server.port=8081

# Static CSS/JS: add a content hash to the URL (e.g. /css/rj-customer-3f2a....css)
# so browsers always load the new file after each change instead of a cached copy.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
spring.web.resources.cache.cachecontrol.no-cache=true

# --- Auth: JWT in an HttpOnly cookie ---
# Override in production with the JWT_SECRET env var (base64, at least 32 bytes).
app.jwt.secret=${JWT_SECRET:uB1GwaFYYJp4G1JIypDHC5FELBKCgv2cM+XeJoz3mTAdsrbymh1hPnMvkt/Oy8ao}
app.jwt.expiration-minutes=480
app.jwt.cookie-name=RJ_AUTH
# true when the site runs over HTTPS
app.jwt.cookie-secure=false

# --- Mail (password reset codes) ---
# Gmail: turn on 2-Step Verification, create an App Password, then set env vars
#   MAIL_USERNAME=you@gmail.com   MAIL_PASSWORD=<16-char app password>
# If MAIL_USERNAME is empty the code is printed to the console instead of being emailed.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}

# i18n - Vietnamese / English (messages.properties, messages_vi.properties, messages_en.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=false

# --- VNPay ---
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.secret-key=${VNPAY_SECRET_KEY:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8081/payments/vnpay-return}

# --- Google OAuth 2.0 ---
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/google-login}
