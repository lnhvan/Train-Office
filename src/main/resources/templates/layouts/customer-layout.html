<!DOCTYPE html>
<html th:lang="${#locale.language}" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content, activeMenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | RailJet'">RailJet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rj-base.css}">
    <link rel="stylesheet" th:href="@{/css/rj-customer.css}">
    <script th:replace="~{fragments/i18n-js :: i18nScript}"></script>
</head>
<body class="rj-customer">
<a class="rj-skip-link" href="#main">[[#{common.skipToContent}]]</a>
<div th:replace="~{fragments/customer-header :: customerHeader(${activeMenu})}"></div>
<main id="main" class="rj-main"><div th:replace="${content}"></div></main>
<div th:replace="~{fragments/customer-footer :: customerFooter}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/modal :: modal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
