<!DOCTYPE html>
<html th:lang="${#locale.language}" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[#{ticket.printTicketRailjet}]]</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/rj-base.css}">
    <link rel="stylesheet" th:href="@{/css/rj-print.css}">
</head>
<body class="rj-print-body">
<div class="lang-switcher--floating"><div th:replace="~{fragments/language-switcher :: languageSwitcher('light')}"></div></div>
<main class="rj-print-shell">
    <div class="rj-print-toolbar">
        <a class="rj-back-link" th:href="@{/tickets/{id}(id=${ticket.ticketId})}">
            <i class="bi bi-arrow-left"></i>
            [[#{ticket.backToTicketInformation}]]
        </a>
        <div class="rj-print-toolbar-actions">
            <button type="button" class="btn btn-outline-secondary" onclick="window.print()">
                <i class="bi bi-download"></i>
                [[#{ticket.saveToPdf}]]
            </button>
            <button type="button" class="btn btn-primary" onclick="window.print()">
                <i class="bi bi-printer"></i>
                [[#{ticket.printTicket}]]
            </button>
        </div>
    </div>

    <article class="rj-doc">
        <header class="rj-doc-head">
            <div>
                <span class="rj-doc-brand"><i class="bi bi-train-front-fill"></i>RailJet</span>
                <h1 th:text="${ticket.passenger != null ? ticket.passenger.fullName : '-'}">Alex Mercer</h1>
            </div>
            <div class="text-end">
                <small>[[#{common.bookingRef}]]</small>
                <strong class="rj-code" th:text="${ticket.booking != null ? ticket.booking.bookingNumber : '-'}">XYZ789</strong>
            </div>
        </header>

        <div class="rj-doc-body">
            <div class="rj-route is-large">
                <div class="rj-route-stop">
                    <span class="rj-route-date">[[#{common.from}]]</span>
                    <span class="rj-route-time"
                          th:text="${ticket.trainTrip != null and ticket.trainTrip.departureTime != null ? #temporals.format(ticket.trainTrip.departureTime, 'HH:mm') : '--:--'}">08:45</span>
                    <span class="rj-route-station"
                          th:text="${ticket.booking != null and ticket.booking.departureStation != null ? ticket.booking.departureStation.stationName : '-'}">Ha Noi</span>
                </div>
                <div class="rj-route-track" aria-hidden="true">
                    <span class="rj-route-dot is-start"></span>
                    <span class="rj-route-meta"
                          th:text="${ticket.trainTrip != null and ticket.trainTrip.train != null ? ticket.trainTrip.train.trainName : 'RailJet Express'}">SE1</span>
                    <span class="rj-route-dot is-end"></span>
                </div>
                <div class="rj-route-stop is-end">
                    <span class="rj-route-date">[[#{common.to}]]</span>
                    <span class="rj-route-time"
                          th:text="${ticket.trainTrip != null and ticket.trainTrip.arrivalTime != null ? #temporals.format(ticket.trainTrip.arrivalTime, 'HH:mm') : '--:--'}">11:15</span>
                    <span class="rj-route-station"
                          th:text="${ticket.booking != null and ticket.booking.arrivalStation != null ? ticket.booking.arrivalStation.stationName : '-'}">Vinh</span>
                </div>
            </div>

            <div class="rj-doc-grid">
                <div>
                    <small>[[#{ticket.date}]]</small>
                    <strong th:text="${ticket.trainTrip != null and ticket.trainTrip.departureTime != null ? #temporals.format(ticket.trainTrip.departureTime, 'dd MMM yyyy') : '-'}">15 Nov 2026</strong>
                </div>
                <div>
                    <small>[[#{common.coach}]]</small>
                    <strong th:text="${ticket.seat != null and ticket.seat.coach != null ? ticket.seat.coach.coachNumber : '-'}">C</strong>
                </div>
                <div>
                    <small>[[#{common.compartment}]]</small>
                    <strong th:text="${ticket.seat != null and ticket.seat.compartment != null ? ticket.seat.compartment.compartmentNumber : '-'}">K01</strong>
                </div>
                <div class="is-highlight">
                    <small>[[#{common.seatBerth}]]</small>
                    <strong>
                        <span th:text="${ticket.seat != null ? ticket.seat.seatNumber : '-'}">12A</span>
                        <small th:if="${ticket.seat != null and ticket.seat.berthLevel != null}"
                               th:text="${ticket.seat.berthLevel == 'LOWER' ? #messages.msg('booking.level1LowerBerth') :
          (ticket.seat.berthLevel == 'MIDDLE' ? #messages.msg('booking.level2MiddleBerth') :
          (ticket.seat.berthLevel == 'UPPER' ? #messages.msg('booking.level3UpperBerth') : ticket.seat.berthLevel))}">LOWER</small>
                    </strong>
                </div>
            </div>
        </div>

        <footer class="rj-doc-foot">
            <i class="bi bi-award"></i>
            <span th:text="${ticket.seat != null and ticket.seat.seatType != null ? ticket.seat.seatType : #messages.msg('ticket.standard')}">First Class</span>
        </footer>
    </article>
</main>
</body>
</html>
