<div class="customer-sidebar" xmlns:th="http://www.thymeleaf.org" th:fragment="customerSidebar(activeMenu)">
    <a th:href="@{/booking/search}" th:classappend="${activeMenu == 'booking'} ? 'active'">
        <i class="bi bi-search"></i> [[#{common.searchTrip}]]
    </a>
    <a th:href="@{/booking/history}" th:classappend="${activeMenu == 'history'} ? 'active'">
        <i class="bi bi-calendar-check"></i> [[#{common.myBookings}]]
    </a>
    <a th:href="@{/profile}" th:classappend="${activeMenu == 'profile'} ? 'active'" th:if="${currentUser != null}">
        <i class="bi bi-person-circle"></i> [[#{common.profile}]]
    </a>
    <a th:href="@{/logout}" th:if="${currentUser != null}">
        <i class="bi bi-box-arrow-right"></i> [[#{common.logout}]]
    </a>



</div>
