<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/customer-layout :: layout(#{payment.paymentFailed}, ~{::section}, 'booking')}">
<section class="rj-page">
    <div class="rj-container rj-narrow">
        <article class="rj-card rj-result">
            <div class="rj-result-icon is-danger"><i class="bi bi-exclamation-lg"></i></div>
            <h1>[[#{payment.paymentFailed}]]</h1>
            <p>[[#{payment.paymentWasNotCompletedPleaseTry}]]</p>

            <div class="rj-ticket-stub">
                <dl class="rj-rows rj-stub-rows">
                    <div>
                        <dt>[[#{common.bookingNumber}]]</dt>
                        <dd class="rj-code" th:text="${bookingCode != null ? bookingCode : (booking != null ? booking.bookingCode : 'RJ1782996611446')}">RJ1782996611446</dd>
                    </div>
                    <div>
                        <dt>[[#{common.status}]]</dt>
                        <dd>
                            <span class="rj-badge is-danger"
                                  th:text="${#messages.msgOrNull('enum.' + (paymentStatus != null ? paymentStatus : 'PENDING_PAYMENT')) ?: (paymentStatus != null ? paymentStatus : 'PENDING_PAYMENT')}">PENDING_PAYMENT</span>
                        </dd>
                    </div>
                </dl>
            </div>

            <div class="rj-result-actions">
                <a class="btn btn-primary btn-lg rj-btn-block" th:href="@{/payments}">
                    <i class="bi bi-arrow-repeat"></i>
                    [[#{payment.retryPayment}]]
                </a>
                <div class="rj-result-secondary">
                    <a class="btn btn-outline-secondary" th:href="@{/booking/history}">[[#{common.myBookings}]]</a>
                    <a class="btn btn-outline-secondary" th:href="@{/support}">[[#{payment.support}]]</a>
                </div>
            </div>
        </article>
    </div>
</section>
</html>
