<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{trip.editTrainTrip}, ~{::section}, 'trips')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-calendar-check"></i> [[#{trip.updateTrip}]]</span>
            <h1>[[#{trip.editTrainTrip}]]</h1>
            <p>[[#{trip.updateRouteSchedulePriceOrTrip}]]</p>
        </div>
        <a class="btn rj-btn-quiet" th:href="@{/admin/trips/{id}(id=${trip.tripId})}">
            <i class="bi bi-arrow-left"></i> [[#{trip.backToDetail}]]
        </a>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card admin-form-card trip-form-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{trip.tripInformation}]]</span>
            <small th:text="#{trip.editingTrip} + ${trip.tripId}">Editing trip</small>
        </div>
        <form th:action="@{/admin/trips/{id}/update(id=${trip.tripId})}" th:object="${trip}" method="post">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.train}]]</label>
                        <select class="form-select" th:field="*{train.trainId}" required>
                            <option th:each="train : ${trains}" th:value="${train.trainId}" th:text="${train.trainCode + ' - ' + train.trainName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.route}]]</label>
                        <select class="form-select" th:field="*{route.routeId}" required>
                            <option th:each="route : ${routes}" th:value="${route.routeId}" th:text="${route.routeCode + ' - ' + route.routeName}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.departureTime}]]</label>
                        <input class="form-control" type="datetime-local" th:field="*{departureTime}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.arrivalTime}]]</label>
                        <input class="form-control" type="datetime-local" th:field="*{arrivalTime}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.basePrice}]]</label>
                        <input class="form-control" type="number" step="1000" min="0" th:field="*{basePrice}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.status}]]</label>
                        <select class="form-select" th:field="*{status}" required>
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${#messages.msgOrNull('enum.' + (status)) ?: (status)}"></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/admin/trips/{id}(id=${trip.tripId})}">[[#{common.cancel}]]</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check2-circle"></i> [[#{trip.updateTrip}]]
                </button>
            </div>
        </form>
    </div>
</section>
</html>
