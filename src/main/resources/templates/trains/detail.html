<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{train.trainDetail}, ~{::section}, 'trains')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-train-front"></i> [[#{train.trainDetail}]]</span>
            <h1 th:text="${detail.trainName}">Train</h1>
            <p th:text="${detail.trainCode}">SE1</p>
        </div>
        <div class="admin-page-actions">
            <a class="btn rj-btn-quiet" th:href="@{/admin/trains}">
                <i class="bi bi-arrow-left"></i> [[#{common.back}]]
            </a>
            <a class="btn btn-outline-info" th:href="@{/admin/coaches(trainId=${detail.trainId})}">
                <i class="bi bi-train-lightrail-front"></i> [[#{common.coaches}]]
            </a>
            <a class="btn btn-warning" th:href="@{/admin/trains/edit/{id}(id=${detail.trainId})}">
                <i class="bi bi-pencil-square"></i> [[#{common.edit}]]
            </a>
        </div>
    </div>

    <div class="card admin-detail-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{train.trainInformation}]]</span>
            <small>[[#{train.fleetReferenceData}]]</small>
        </div>
        <div class="card-body">
            <dl class="admin-detail-grid">
                <dt>ID</dt><dd th:text="${detail.trainId}">1</dd>
                <dt>[[#{common.code}]]</dt><dd th:text="${detail.trainCode}">SE1</dd>
                <dt>[[#{common.name}]]</dt><dd th:text="${detail.trainName}">Train</dd>
                <dt>[[#{common.type}]]</dt><dd th:text="${detail.trainType}">Express</dd>
            </dl>
        </div>
    </div>
</section>
</html>
