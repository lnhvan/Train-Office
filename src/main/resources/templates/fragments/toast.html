<div class="rj-toast-stack"
     xmlns:th="http://www.thymeleaf.org"
     th:fragment="toast"
     th:if="${toastMessage != null or successMessage != null or errorMessage != null}"
     role="status"
     aria-live="polite">
    <div class="rj-toast"
         th:classappend="${errorMessage != null} ? ' is-danger' : ' is-success'">
        <i class="rj-toast-icon"
           th:classappend="${errorMessage != null} ? ' bi bi-exclamation-octagon-fill' : ' bi bi-check-circle-fill'"></i>
        <div>
            <strong th:text="${toastTitle ?: (errorMessage != null ? #messages.msg('common.actionFailed') : 'RailJet')}">RailJet</strong>
            <p th:text="${toastMessage ?: (successMessage ?: errorMessage)}">Message</p>
        </div>
        <button type="button"
                class="rj-toast-close"
                onclick="this.closest('.rj-toast-stack').remove()"
                th:aria-label="#{common.close}">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
</div>
