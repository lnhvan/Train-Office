<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{user.userForm}, ~{::section}, 'users')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-person-gear"></i> [[#{user.userProfile}]]</span>
            <h1 th:text="${user.userId == null ? #messages.msg('user.createUser') : #messages.msg('user.editUser')}">User form</h1>
            <p th:text="${user.userId == null ? #messages.msg('user.setLoginCredentialsRoleAndAccount') : #messages.msg('user.editAccountRoleAndStatusHint')}">
                [[#{user.setLoginCredentialsRoleAndAccount}]]
            </p>
        </div>
        <a class="btn rj-btn-quiet" th:href="@{/admin/users}">
            <i class="bi bi-arrow-left"></i> [[#{user.backToUsers}]]
        </a>
    </div>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card admin-form-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{user.accountInformation}]]</span>
            <small th:text="${user.userId == null ? #messages.msg('user.requiredFieldsAreUsedByThe') : #messages.msg('user.editAccountRoleAndStatusHint')}">
                [[#{user.requiredFieldsAreUsedByThe}]]
            </small>
        </div>
        <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{userId}">
            <div class="card-body">
                <div class="row">
                    <!-- Email -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input class="form-control" th:field="*{email}" type="email"
                                   th:readonly="${user.userId != null}"
                                   th:classappend="${user.userId != null} ? ' bg-light text-muted'"
                                   th:tabindex="${user.userId != null ? '-1' : '0'}"
                                   required>
                        </div>
                        <div class="form-text text-muted" th:if="${user.userId != null}">
                            <i class="bi bi-lock-fill"></i> [[#{user.fieldReadonlyForAdmin}]]
                        </div>
                    </div>

                    <!-- Mật khẩu: chỉ hiển thị khi tạo mới tài khoản -->
                    <div class="col-md-6 mb-3" th:if="${user.userId == null}">
                        <label class="form-label">[[#{common.password}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input class="form-control" id="password" name="password" type="password" value=""
                                   autocomplete="new-password"
                                   th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"
                                   required
                                   th:placeholder="#{user.requiredForNewUser}">
                        </div>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <!-- Họ và tên -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">[[#{common.fullName}]]</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                            <input class="form-control" th:field="*{fullName}"
                                   th:readonly="${user.userId != null}"
                                   th:classappend="${user.userId != null} ? ' bg-light text-muted'"
                                   th:tabindex="${user.userId != null ? '-1' : '0'}">
                        </div>
                        <div class="form-text text-muted" th:if="${user.userId != null}">
                            <i class="bi bi-lock-fill"></i> [[#{user.fieldReadonlyForAdmin}]]
                        </div>
                    </div>

                    <!-- Vai trò -->
                    <div th:class="${user.userId == null ? 'col-md-3 mb-3' : 'col-md-6 mb-3'}">
                        <label class="form-label">[[#{user.role}]]</label>
                        <select class="form-select" th:field="*{role}" required>
                            <option th:each="role : ${roles}" th:value="${role}" th:text="${#messages.msgOrNull('enum.' + (role)) ?: (role)}"></option>
                        </select>
                    </div>

                    <!-- Trạng thái -->
                    <div th:class="${user.userId == null ? 'col-md-3 mb-3' : 'col-md-6 mb-3'}">
                        <label class="form-label">[[#{common.status}]]</label>
                        <select class="form-select" th:field="*{status}" required>
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${#messages.msgOrNull('enum.' + (status)) ?: (status)}"></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-end">
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-check2-circle"></i> [[#{common.save}]]
                </button>
            </div>
        </form>
    </div>
</section>
</html>
