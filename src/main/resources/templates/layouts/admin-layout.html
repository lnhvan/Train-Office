<!DOCTYPE html>
<html th:lang="${#locale.language}" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content, activeMenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | RailJet Admin'">RailJet Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/rj-base.css}">
    <link rel="stylesheet" th:href="@{/css/rj-admin.css}">
    <script th:replace="~{fragments/i18n-js :: i18nScript}"></script>
</head>
<body class="rj-admin">
<a class="rj-skip-link" href="#main">[[#{common.skipToContent}]]</a>
<div class="rj-admin-shell">
    <div th:replace="~{fragments/admin-sidebar :: adminSidebar(${activeMenu})}"></div>
    <div class="rj-admin-backdrop" data-rj-sidebar-close></div>
    <div class="rj-admin-main">
        <div th:replace="~{fragments/admin-header :: adminHeader}"></div>
        <main id="main" class="rj-admin-content">
            <div class="rj-admin-container"><div th:replace="${content}"></div></div>
        </main>
        <div th:replace="~{fragments/admin-footer :: adminFooter}"></div>
    </div>
</div>
<div th:replace="~{fragments/toast :: toast}"></div>
<div th:replace="~{fragments/modal :: modal}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
