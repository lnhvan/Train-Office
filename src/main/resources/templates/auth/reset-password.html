<!DOCTYPE html>
<html th:lang="${#locale.language}" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[#{auth.resetPasswordRailjet}]]</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/rj-base.css}">
    <link rel="stylesheet" th:href="@{/css/rj-auth.css}">
</head>
<body class="rj-auth">
<div class="lang-switcher--floating"><div th:replace="~{fragments/language-switcher :: languageSwitcher('dark')}"></div></div>
<main class="rj-auth-layout">
    <aside class="rj-auth-aside" aria-hidden="true">
        <a class="rj-auth-brand" th:href="@{/booking/search}"><i class="bi bi-train-front-fill"></i>RailJet</a>
        <div class="rj-auth-aside-copy">
            <p class="rj-auth-aside-title">[[#{booking.crossDistance}]]<br>[[#{booking.masterTime}]]</p>
            <p>[[#{auth.technologicalElegance}]]</p>
        </div>
        <div class="rj-auth-track"><span></span><span></span></div>
    </aside>

    <section class="rj-auth-panel">
        <a class="rj-back-link" th:href="@{/login}">
            <i class="bi bi-arrow-left"></i>
            [[#{common.cancel}]]
        </a>
        <div class="rj-auth-card">
            <span class="rj-auth-icon"><i class="bi bi-shield-lock"></i></span>
            <h1>[[#{auth.resetPassword}]]</h1>
            <p class="rj-auth-sub" th:utext="#{auth.resetCodeSub(${#strings.escapeXml(resetEmail)}, ${resetCodeMinutes})}">
                Nhập mã 6 số đã gửi tới <strong>ng***@gmail.com</strong>.
            </p>

            <div class="alert alert-success"
                 th:if="${successMessage}"
                 th:text="${successMessage}">
                Thành công.
            </div>
            <div class="alert alert-info"
                 th:if="${infoMessage}"
                 th:text="${infoMessage}">
                Info.
            </div>
            <div class="alert alert-danger"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
                Có lỗi xảy ra.
            </div>

            <form id="resetPasswordForm"
                  th:action="@{/reset-password}"
                  th:object="${resetPasswordForm}"
                  method="post"
                  autocomplete="off"
                  novalidate>
            <div class="rj-field">
                <label class="form-label" for="code">[[#{auth.resetCode}]]</label>
                <input id="code"
                       type="text"
                       class="form-control rj-otp-input"
                       th:classappend="${#fields.hasErrors('code')} ? ' is-invalid'"
                       th:field="*{code}"
                       inputmode="numeric"
                       pattern="[0-9]{6}"
                       maxlength="6"
                       autocomplete="one-time-code"
                       placeholder="••••••"
                       autofocus
                       required>
                <div class="rj-field-error"
                     th:if="${#fields.hasErrors('code')}"
                     th:errors="*{code}">
                </div>
            </div>
            <div class="rj-field">
                <label class="form-label" for="password">[[#{common.newPassword}]]</label>
                <div class="auth-input-wrap rj-input-icon">
                    <i class="bi bi-lock"></i>
                    <input id="password"
                           type="password"
                           class="form-control password-input"
                           th:field="*{password}"
                           autocomplete="new-password"
                           th:placeholder="#{auth.enterNewPassword}"
                           required>
                    <button class="rj-reveal password-toggle"
                            type="button"
                            th:aria-label="#{auth.togglePasswordVisibility2}">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>
                <div class="rj-field-error"
                     th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}">
                </div>
            </div>
            <div class="rj-field">
                <label class="form-label" for="confirmPassword">[[#{auth.confirmPassword}]]</label>
                <div class="auth-input-wrap rj-input-icon">
                    <i class="bi bi-lock"></i>
                    <input id="confirmPassword"
                           type="password"
                           class="form-control password-input"
                           th:field="*{confirmPassword}"
                           autocomplete="new-password"
                           th:placeholder="#{auth.confirmYourPassword}"
                           required>
                    <button class="rj-reveal password-toggle"
                            type="button"
                            th:aria-label="#{auth.togglePasswordVisibility2}">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>
                <div class="rj-field-error"
                     th:if="${#fields.hasErrors('confirmPassword')}"
                     th:errors="*{confirmPassword}">
                </div>
            </div>
                <button class="btn btn-primary btn-lg rj-btn-block" type="submit">
                    [[#{auth.updatePassword}]]
                </button>
            </form>

            <form class="rj-auth-foot rj-resend" th:action="@{/reset-password/resend}" method="post">
                <span>[[#{auth.didNotGetCode}]]</span>
                <button type="submit" class="btn btn-link p-0 align-baseline">[[#{auth.resendCode}]]</button>
                <span aria-hidden="true">·</span>
                <a th:href="@{/forgot-password}">[[#{auth.useAnotherEmail}]]</a>
            </form>
        </div>
    </section>
</main>
<script th:src="@{/js/rail-auth.js}"></script>
</body>
</html>
