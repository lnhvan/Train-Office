<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{discount.discountPolicyForm}, ~{::section}, 'discounts')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker">
                <i class="bi bi-percent"></i>
                [[#{discount.farePolicy}]]
            </span>

            <h1 th:text="${policy.policyId == null ? #messages.msg('discount.createDiscountPolicy') : #messages.msg('discount.updateDiscountPolicy')}">
                Discount Policy Form
            </h1>

            <p>[[#{discount.configurePassengerAgeRangeAndDiscount}]]</p>
        </div>

        <a class="btn rj-btn-quiet" th:href="@{/admin/discount-policies}">
            <i class="bi bi-arrow-left"></i>
            [[#{discount.backToPolicies}]]
        </a>
    </div>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card admin-form-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{discount.policyInformation}]]</span>
            <small>[[#{discount.exampleSenior2026Age63Discount}]]</small>
        </div>

        <form th:action="@{/admin/discount-policies/save}" th:object="${policy}" method="post">
            <input type="hidden" th:field="*{policyId}">

            <div class="card-body">
                <div class="row">
                    <div class="col-lg-3 mb-3">
                        <label class="form-label">[[#{common.policyCode}]]</label>
                        <input class="form-control"
                               th:field="*{policyCode}"
                               placeholder="SENIOR"
                               required>
                    </div>

                    <div class="col-lg-5 mb-3">
                        <label class="form-label">[[#{common.policyName}]]</label>
                        <input class="form-control"
                               th:field="*{policyName}"
                               th:placeholder="#{discount.seniorCitizen}"
                               required>
                    </div>

                    <div class="col-lg-2 mb-3">
                        <label class="form-label">[[#{common.displayOrder}]]</label>
                        <input class="form-control"
                               type="number"
                               min="1"
                               th:field="*{displayOrder}">
                    </div>

                    <div class="col-lg-2 mb-3">
                        <label class="form-label">[[#{common.active}]]</label>
                        <select class="form-select" th:field="*{active}">
                            <option th:value="true">[[#{common.active}]]</option>
                            <option th:value="false">[[#{common.inactive}]]</option>
                        </select>
                    </div>

                    <div class="col-lg-3 mb-3">
                        <label class="form-label">[[#{discount.minAge}]]</label>
                        <input class="form-control"
                               type="number"
                               min="0"
                               th:field="*{minAge}"
                               required>
                    </div>

                    <div class="col-lg-3 mb-3">
                        <label class="form-label">[[#{discount.maxAge}]]</label>
                        <input class="form-control"
                               type="number"
                               min="0"
                               th:field="*{maxAge}"
                               th:placeholder="#{common.emptyNoLimit}">
                    </div>

                    <div class="col-lg-3 mb-3">
                        <label class="form-label">[[#{common.discountPercent}]]</label>
                        <div class="input-group">
                            <input class="form-control"
                                   type="number"
                                   min="0"
                                   max="100"
                                   step="0.01"
                                   th:field="*{discountPercent}"
                                   required>
                            <span class="input-group-text">%</span>
                        </div>
                    </div>

                    <div class="col-lg-12 mb-3">
                        <label class="form-label">[[#{common.description}]]</label>
                        <input class="form-control"
                               th:field="*{description}"
                               th:placeholder="#{common.optionalNote}">
                    </div>
                </div>
            </div>

            <div class="card-footer d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/admin/discount-policies}">
                    [[#{common.cancel}]]
                </a>

                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-check2-circle"></i>
                    [[#{discount.savePolicy}]]
                </button>
            </div>
        </form>
    </div>
</section>
</html>
