<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/customer-layout :: layout(#{booking.bookingCompleted}, ~{::section}, 'booking')}">
<section class="rj-page">
    <div class="rj-container rj-narrow">
        <article class="rj-card rj-result">
            <div class="rj-result-icon"><i class="bi bi-check-lg"></i></div>
            <h1>[[#{booking.bookingCompleted2}]]</h1>
            <p>[[#{booking.yourJourneyHasBeenReservedPlease}]]</p>

            <div class="rj-ticket-stub" th:if="${booking != null}">
                <div class="rj-ticket-stub-row">
                    <div>
                        <small>[[#{common.bookingNumber}]]</small>
                        <strong class="rj-code" th:text="${booking.bookingNumber}">RJ0001</strong>
                    </div>
                    <div class="text-end">
                        <small>[[#{common.status}]]</small>
                        <span class="rj-badge is-warning"
                              th:text="${#messages.msgOrNull('enum.' + (booking.bookingStatus)) ?: (booking.bookingStatus)}">Pending Payment</span>
                    </div>
                </div>
                <div class="rj-ticket-stub-row is-total">
                    <small>[[#{common.totalAmount}]]</small>
                    <strong class="rj-num" th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</strong>
                </div>
            </div>

            <div class="rj-result-actions">
                <a class="btn btn-primary btn-lg rj-btn-block"
                   th:if="${booking != null and booking.bookingStatus != null and booking.bookingStatus.name() == 'PENDING_PAYMENT'}"
                   th:href="@{/payments/bookings/{id}(id=${booking.bookingId})}">
                    <i class="bi bi-wallet2"></i>
                    [[#{common.payWithVnpay}]]
                </a>
                <div class="rj-result-secondary">
                    <a class="btn btn-outline-secondary" th:href="@{/booking/history}">
                        <i class="bi bi-ticket-perforated"></i>
                        [[#{common.viewMyBookings}]]
                    </a>
                    <a class="btn btn-outline-secondary" th:href="@{/booking/search}">
                        <i class="bi bi-plus-lg"></i>
                        [[#{common.bookAnotherTrip}]]
                    </a>
                </div>
            </div>
        </article>
    </div>
</section>
</html>
