<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{station.stationDetail}, ~{::section}, 'stations')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-geo-alt"></i> [[#{station.stationDetail}]]</span>
            <h1 th:text="${detail.stationName}">Station</h1>
            <p th:text="${detail.city}">City</p>
        </div>
        <div class="admin-page-actions">
            <a class="btn rj-btn-quiet" th:href="@{/admin/stations}">
                <i class="bi bi-arrow-left"></i> [[#{common.back}]]
            </a>
            <a class="btn btn-warning" th:href="@{'/admin/stations/edit/' + ${detail.stationId}}">
                <i class="bi bi-pencil-square"></i> [[#{common.edit}]]
            </a>
        </div>
    </div>

    <div class="card admin-detail-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{station.stationInformation}]]</span>
            <small>[[#{station.infrastructureReferenceData}]]</small>
        </div>
        <div class="card-body">
            <dl class="admin-detail-grid">
                <dt>ID</dt><dd th:text="${detail.stationId}">1</dd>
                <dt>[[#{common.code}]]</dt><dd th:text="${detail.stationCode}">HN</dd>
                <dt>[[#{common.name}]]</dt><dd th:text="${detail.stationName}">Ha Noi</dd>
                <dt>[[#{common.province}]]</dt><dd th:text="${detail.province != null ? detail.province.provinceName : detail.city}">Ha Noi</dd>
                <dt>[[#{common.region}]]</dt><dd th:text="${detail.province != null ? (#messages.msgOrNull('enum.' + detail.province.region) ?: detail.province.region) : '-'}">Miền Bắc</dd>
            </dl>
        </div>
    </div>
</section>
</html>
