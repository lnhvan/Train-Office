<header class="rj-admin-topbar"
        xmlns:th="http://www.thymeleaf.org" th:fragment="adminHeader">
    <button class="rj-admin-burger"
            type="button"
            data-rj-sidebar-toggle
            aria-controls="rjAdminSidebar"
            aria-expanded="false"
            th:aria-label="#{common.openMenu}">
        <i class="bi bi-list"></i>
    </button>

    <nav class="rj-admin-quick" th:aria-label="#{common.quickAccess}">
        <a th:href="@{/admin/dashboard}">
            <i class="bi bi-graph-up"></i>[[#{common.dashboard}]]
        </a>
        <a th:href="@{/admin/users}">
            <i class="bi bi-person-badge"></i>[[#{common.users}]]
        </a>
    </nav>

    <div class="rj-admin-topbar-end">
        <div th:replace="~{fragments/language-switcher :: languageSwitcher('light')}"></div>

        <a class="rj-admin-toplink" th:href="@{/}">
            <i class="bi bi-globe2"></i><span>[[#{common.viewSite}]]</span>
        </a>

        <a class="rj-admin-user" th:if="${currentUser != null}" th:href="@{/profile}">
            <span class="rj-admin-user-avatar"><i class="bi bi-person"></i></span>
            <span class="rj-admin-user-email" th:text="${currentUser.email}">Admin</span>
        </a>

        <a class="rj-admin-toplink is-danger" th:if="${currentUser != null}" th:href="@{/logout}">
            <i class="bi bi-box-arrow-right"></i><span>[[#{common.logout}]]</span>
        </a>
    </div>
</header>
