<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/admin-layout :: layout(#{seat.seatDetail}, ~{::section}, 'seats')}">
<section>
    <div class="admin-page-hero">
        <div>
            <span class="admin-page-kicker"><i class="bi bi-grid-3x2-gap"></i> [[#{seat.seatDetail}]]</span>
            <h1 th:text="${detail.seatNumber}">Seat</h1>
            <p th:text="${detail.coach != null ? detail.coach.coachNumber : #messages.msg('seat.noCoach')}">Coach</p>
        </div>
        <div class="admin-page-actions">
            <a class="btn rj-btn-quiet" th:href="@{/admin/seats}">
                <i class="bi bi-arrow-left"></i> [[#{common.back}]]
            </a>
            <a class="btn btn-warning" th:href="@{/admin/seats/edit/{id}(id=${detail.seatId})}">
                <i class="bi bi-pencil-square"></i> [[#{common.edit}]]
            </a>
        </div>
    </div>

    <div class="card admin-detail-card">
        <div class="card-header">
            <span class="admin-card-title">[[#{seat.seatInformation}]]</span>
            <small>[[#{seat.seatTypeAndPriceModifier}]]</small>
        </div>
        <div class="card-body">
            <dl class="admin-detail-grid">
                <dt>ID</dt><dd th:text="${detail.seatId}">1</dd>
                <dt>[[#{common.coach}]]</dt><dd th:text="${detail.coach != null ? detail.coach.coachNumber : '-'}">C01</dd>
                <dt>[[#{seat.seatNumber}]]</dt><dd th:text="${detail.seatNumber}">A1</dd>
                <dt>[[#{common.type}]]</dt><dd><span class="seat-type-badge" th:text="${detail.seatType}">STANDARD</span></dd>
                <dt>[[#{seat.extraPrice}]]</dt><dd th:text="${detail.extraPrice}">0</dd>
            </dl>
        </div>
    </div>
</section>
</html>
